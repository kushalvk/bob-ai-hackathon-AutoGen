submission:
  title: "ClinGuard AI"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    A major clinical trial has 5,000+ patient visits across 200+ sites. Protocol deviations — missed visits, wrong dosing, banned co-medications — go undetected until the FDA audit. A single rejected submission delays drug approval by 6–12 months and costs $50–100M. Risk managers need real-time visibility into which sites are highest risk before problems escalate.

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
    ClinGuard AI is an autonomous clinical protocol compliance platform that combines deterministic deviation detection, hybrid ICH E6(R2) severity classification with IBM watsonx.ai narrative rationale, quantitative 7-factor site risk scoring (0–100), automated CAPA report generation with dual Markdown/PDF export, and a Model Context Protocol (MCP) server for zero-hallucination conversational querying.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Deterministic Protocol Deviation Detection across visit schedules, dosing, prohibited co-medications, eligibility, and documentation"
    - "Hybrid Severity Classifier pairing deterministic ICH E6(R2) rule tables with IBM watsonx.ai narrative clinical review"
    - "Deterministic 7-Factor Site Risk Scoring Engine (0-100) with transparent mathematical contributing factors breakdown"
    - "Automated CAPA Report Generator clustering related breaches within 30 days with one-click Markdown and signed PDF export"
    - "Model Context Protocol (MCP) Server providing 4 tools for natural language compliance querying without LLM hallucination"

  tech_stack:
    languages: ["Python", "TypeScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React", "Vite", "TailwindCSS"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai", "IBM Bob"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["SQLite", "PostgreSQL"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Model Context Protocol (MCP)", "fpdf2", "pytest"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
    The strict architectural boundary between deterministic clinical compliance logic and generative AI: all deviation detection, 7-factor risk arithmetic (0-100), and evidence indexing are 100% deterministic and unit-tested (107/107 passing tests), while watsonx.ai is used exclusively where regulatory narrative synthesis is required (ICH E6(R2) rationale and CAPA root cause formulation). The integrated MCP server guarantees conversational assistants provide exact trial figures without ever hallucinating compliance metrics.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Live LLM severity reviews and custom narrative generation require active IBM watsonx.ai credentials; when unconfigured, the system automatically falls back to deterministic rule tables and standard clinical CAPA templates. Streaming data ingestion currently processes simulated Phase II/III protocol data batches rather than direct live CDISC ODM electronic data capture feeds.

